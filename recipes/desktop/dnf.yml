---
# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      nonfree: negativo17

    install:
      install-weak-deps: true
      allow-erasing: true
      packages:
        # development
        - repo: terra
          packages:
            - zed

        # video
        - gstreamer1-plugin-vaapi
        - mesa-va-drivers

        # development
        - rustup

        # gaming
        - mangohud
        - mono-core

        - steam
        - steam-devices

        - repo: terra
          packages:
            - 8bitdo-udev-rules

        # productivity
        - https://github.com/peteonrails/voxtype/releases/download/v1.0.1/voxtype-1.0.1-1.x86_64.rpm
        - wtype

        # system
        - repo: terra
          packages:
            - lact
            - lan-mouse

        # virtualization
        - libvirt
        - libvirt-nss
        - libvirt-daemon-driver-storage-zfs
        - qemu-device-display-virtio-gpu
        - qemu-device-display-virtio-vga
        - qemu-device-usb-redirect
        - qemu-img
        - qemu-kvm
        - qemu-tools
        - qemu-user
        - qemu-user-binfmt
        - virt-install
        - virt-manager
        - virt-viewer
