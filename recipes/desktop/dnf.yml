---
# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      nonfree: negativo17
    install:
      install-weak-deps: true
      allow-erasing: true
      packages:
        # system
        - input-remapper

        # video
        - gstreamer1-plugin-vaapi
        - libheif
        - mesa-va-drivers

        # development
        - rustup

        # gaming
        - https://github.com/ilya-zlobintsev/LACT/releases/download/v0.9.0/lact-0.9.0-0.x86_64.fedora-43.rpm
        - mangohud
        - mono-core
        - steam

        # virtualization
        - libvirt
        - libvirt-nss
        - libvirt-daemon-driver-storage-zfs
        - qemu-device-display-virtio-gpu
        - qemu-device-display-virtio-vga
        - qemu-device-usb-redirect
        - qemu-img
        - qemu-kvm
        - qemu-tools
        - qemu-user
        - qemu-user-binfmt
        - virt-install
        - virt-manager
        - virt-viewer
