---
# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json

modules:
  - type: dnf
    repos:
      copr:
        - lilay/topgrade

      files:
        add:
          - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo

    install:
      packages:
        - alacritty
        - android-tools
        - chezmoi
        - distrobox
        - fastfetch
        - fish
        - gdisk
        - git-filter-repo
        - input-remapper
        - kvantum
        - libappindicator
        - libappindicator-gtk3
        - libayatana-appindicator-gtk3
        - mbuffer
        - micro
        - numix-icon-theme-circle
        - podman-compose
        - pv
        - rbw
        - terra-release
        - topgrade
