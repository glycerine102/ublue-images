---
# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json

modules:
  - type: dnf

    repos:
      copr:
        - sneexy/python-validity

    install:
      packages:
        # development
        - repo: terra
          packages:
            - zed

        - fprintd-clients
        - fprintd-clients-pam
        - open-fprintd
        - python3-validity
        - tlp
        - tlp-rdw

        - repo: terra
          packages:
            - lan-mouse

    remove:
      auto-remove: true
      packages:
        - tuned
        - tuned-ppd
