---
# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json

modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - sneexy/python-validity

    install:
      install-weak-deps: true
      allow-erasing: true
      packages:
        # development
        - repo: terra
          packages:
            - zed

        # system
        - fprintd-clients
        - fprintd-clients-pam
        - open-fprintd
        - python3-validity
        - tlp
        - tlp-rdw
        - repo: terra
          packages:
            - lan-mouse

    remove:
      auto-remove: true
      packages:
        - tuned
        - tuned-ppd
