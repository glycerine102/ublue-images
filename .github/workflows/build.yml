name: bluebuild
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe: kinoite.yml
            image: plasma-desktop
            fedora: "44"
          - recipe: thinkpad.yml
            image: thinkpad-laptop
            fedora: "44"

    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true

      - name: Add short image tags
        uses: shrink/actions-docker-registry-tag@v5
        with:
          registry: ghcr.io
          repository: glycerine102/${{ matrix.image }}
          target: ${{ steps.image_metadata.outputs.source_tag }}
          tags: |
            latest
            ${{ steps.image_metadata.outputs.short_sha }}
            ${{ matrix.fedora }}
            ${{ steps.image_metadata.outputs.build_date }}

  clean:
    needs: bluebuild
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        package:
          - "plasma-desktop"
          - "thinkpad-laptop"

    steps:
      - name: Removes old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          min-versions-to-keep: 27
          delete-only-pre-release-versions: "false"
          package-type: "container"
